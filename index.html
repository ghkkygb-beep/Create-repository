<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة المقطار التراثية</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body {
      background: #1a0f0a;
      color: #f3e5ab;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    h1 { margin: 0 0 5px 0; color: #d4af37; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    #status {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid #d4af37;
      padding: 8px 20px;
      border-radius: 20px;
      margin-bottom: 20px;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .board-container {
      position: relative;
      width: 330px;
      height: 330px;
      background: radial-gradient(circle, #3d2314 0%, #24140b 100%);
      border: 10px solid #8b5a2b;
      border-radius: 15px;
      box-shadow: inset 0 0 20px #000, 0 10px 25px rgba(0,0,0,0.8);
    }
    .line-outer { position: absolute; top: 25px; left: 25px; width: 260px; height: 260px; border: 3px solid #d4af37; opacity: 0.8; }
    .line-mid { position: absolute; top: 68px; left: 68px; width: 174px; height: 174px; border: 3px solid #d4af37; opacity: 0.8; }
    .line-inner { position: absolute; top: 111px; left: 111px; width: 88px; height: 88px; border: 3px solid #d4af37; opacity: 0.8; }
    
    .cross-v { position: absolute; top: 25px; left: 154px; width: 3px; height: 260px; background: #d4af37; opacity: 0.8; }
    .cross-h { position: absolute; top: 154px; left: 25px; width: 260px; height: 3px; background: #d4af37; opacity: 0.8; }
    .center-mask { position: absolute; top: 114px; left: 114px; width: 82px; height: 82px; background: #2f1b0f; z-index: 2; }

    .spot {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #110905;
      border: 2px solid #8b5a2b;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 10;
      transition: all 0.2s ease;
    }
    .spot:hover { transform: translate(-50%, -50%) scale(1.25); border-color: #fff; }
    
    .spot.p1 {
      background: radial-gradient(circle at 30% 30%, #ffe066, #d4af37);
      border-color: #fff;
      box-shadow: 0 0 10px #d4af37, inset -2px -2px 5px rgba(0,0,0,0.5);
    }
    .spot.p2 {
      background: radial-gradient(circle at 30% 30%, #ffffff, #a6b1b7);
      border-color: #fff;
      box-shadow: 0 0 10px #a6b1b7, inset -2px -2px 5px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <h1>🐪 لعبة المقطار</h1>
  <div id="status">دور اللاعب الأول (القطع الذهبية)</div>

  <div class="board-container">
    <div class="line-outer"></div>
    <div class="line-mid"></div>
    <div class="line-inner"></div>
    <div class="cross-v"></div>
    <div class="cross-h"></div>
    <div class="center-mask"></div>

    <div class="spot" style="top:25px; left:25px" data-id="0"></div>
    <div class="spot" style="top:25px; left:155px" data-id="1"></div>
    <div class="spot" style="top:25px; left:285px" data-id="2"></div>
    
    <div class="spot" style="top:68px; left:68px" data-id="3"></div>
    <div class="spot" style="top:68px; left:155px" data-id="4"></div>
    <div class="spot" style="top:68px; left:242px" data-id="5"></div>
    
    <div class="spot" style="top:111px; left:111px" data-id="6"></div>
    <div class="spot" style="top:111px; left:155px" data-id="7"></div>
    <div class="spot" style="top:111px; left:199px" data-id="8"></div>

    <div class="spot" style="top:155px; left:25px" data-id="9"></div>
    <div class="spot" style="top:155px; left:68px" data-id="10"></div>
    <div class="spot" style="top:155px; left:111px" data-id="11"></div>
    <div class="spot" style="top:155px; left:199px" data-id="12"></div>
    <div class="spot" style="top:155px; left:242px" data-id="13"></div>
    <div class="spot" style="top:155px; left:285px" data-id="14"></div>

    <div class="spot" style="top:199px; left:111px" data-id="15"></div>
    <div class="spot" style="top:199px; left:155px" data-id="16"></div>
    <div class="spot" style="top:199px; left:199px" data-id="17"></div>

    <div class="spot" style="top:242px; left:68px" data-id="18"></div>
    <div class="spot" style="top:242px; left:155px" data-id="19"></div>
    <div class="spot" style="top:242px; left:242px" data-id="20"></div>

    <div class="spot" style="top:285px; left:25px" data-id="21"></div>
    <div class="spot" style="top:285px; left:155px" data-id="22"></div>
    <div class="spot" style="top:285px; left:285px" data-id="23"></div>
  </div>

  <script>
    let board = Array(24).fill(null);
    let player = 'p1';
    const status = document.getElementById('status');

    document.querySelectorAll('.spot').forEach(spot => {
      spot.addEventListener('click', () => {
        const id = spot.dataset.id;
        if (!board[id]) {
          board[id] = player;
          spot.classList.add(player);
          player = player === 'p1' ? 'p2' : 'p1';
          status.innerText = `دور اللاعب: ${player === 'p1' ? 'الأول (الذهبي)' : 'الثاني (الفضي)'}`;
        }
      });
    });
  </script>
</body>
</html>
